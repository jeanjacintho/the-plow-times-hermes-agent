# The declarative half of ~/.hermes-the-plow-times -- everything that is a
# deliberate choice for this deployment. Keys equal to the image's own defaults
# are deliberately absent, so the pinned image supplies its current defaults
# rather than a frozen snapshot of them.
#
# Default model is Claude Sonnet 5 on the Plow provider — a paper pin,
# not the fleet seed (base-ef00193 defaults to z-ai/glm-5.2). merge_pt_seed_config.py
# stamps this onto plow-seed so plow-init does not restore glm on boot.
# It has to be listed under providers.plow.models too, not only as
# model.default, or Hermes keeps offering the previous catalog entry.
#
# No group_sessions_per_user override at MVP scope: this agent has one private
# chat and no groups (design doc §3.2), so the image default is fine.

model:
  default: anthropic/claude-sonnet-5
  provider: plow
  base_url: "${PLOW_API_BASE}/v1"
  key_env: HERMES_CUSTOM_PLOW_API_KEY
providers:
  plow:
    name: plow
    base_url: "${PLOW_API_BASE}/v1"
    key_env: HERMES_CUSTOM_PLOW_API_KEY
    stale_timeout_seconds: 55
    models:
      anthropic/claude-sonnet-5: {}

# Boot recomposes SOUL.md from plow-seed; the newspaper file has to be
# that seed or the generic Plow-assistant persona wins every start.
# Hermes truncates that file at 20 000 unless this key is on the seed
# (merge_pt_seed_config.py), not only here.
context_file_max_chars: 40000

# No `mcp_servers` key on purpose. Reaching the owner's Mac over the Plow
# relay is the whole point of this agent -- the browser it researches with is
# the operator's Mac, not this container -- but the base image already
# declares that server and owns it: plow-init stamps the one relay entry from
# plow-seed/config.yaml and enables it exactly when `/v1/agents/me` comes back
# carrying a relay, so an agent without one has nothing to connect to instead
# of a server that fails per call. Its own comment says as much: "the one
# entry in `mcp_servers` this image manages. Any other belongs to [the agent]."
#
# This file used to declare a second relay server beside it, with the device
# in the URL and a static DOMO_* pair from the instance dotenv. Two servers
# reached one Mac, and the hand-pasted one won: once it went stale the relay
# answered 401 on every call through it while the agent's own credential --
# minted with `relay:call`, and already published as PLOW_MCP_URL -- sat
# unused (2026-09-22). Declaring nothing here is what keeps that to one path.
# Research still rides plow_browser_* against the owner's Mac, and this agent
# installs no connectors (skills.tsv is empty for the same reason).
# Hermes wraps every cron-delivered message in a "Cronjob Response: <job>
# (job_id: ...) ------- <content> To stop or manage this job..." envelope by
# default (cron/scheduler.py, wrap_response: True unless set otherwise). Every
# edition ships over exactly that path (--deliver plow_chat:${PLOW_HOME_CHANNEL}
# on pt-oneoff-*, pt-subscription-* and pt-daily-edition), and pt-edition/
# SKILL.md's whole promise is that the chat text is the renderer's output
# pasted verbatim -- the wrapper breaks that promise on every single delivery,
# not as an edge case. Disabled here, not worked around per-skill.
cron:
  wrap_response: false
# Unset, terminal.cwd falls back to the Hermes INSTALL tree (/opt/hermes) --
# confirmed live, every turn: "working-directory resolution fell back to the
# Hermes install tree". Every pt-* SKILL.md now uses absolute script paths
# (/var/lib/hermes/skills/pt-*/scripts/...) precisely because a relative
# cwd can't be trusted, but "run/<id>/edition.json" and friends are still
# relative, and /opt/hermes is the read-only package source, not a place this
# agent can write a run directory. HERMES_HOME is where the agent actually
# lives and owns its own state (pt/, skills/, memories/).
terminal:
  cwd: /var/lib/hermes
# Hermes still ships web_search / web_extract (Firecrawl, Exa, Keenable,
# Parallel) and its own Playwright `browser_*` tools. Measured live, an
# on-demand paper used those from the container instead of Latch's Mac
# browser. They are off globally: research is plow_browser_* or it is not
# sourced. MCP `latch` is not a toolset and stays enabled.
agent:
  disabled_toolsets:
    - web
    - search
    - browser
# plow_chat is not in Hermes' quiet platform defaults (photon/iMessage is
# TIER_LOW; this adapter inherits tool_progress: all and
# interim_assistant_messages: true). Measured live: every research
# decision landed in the owner's DM as a real message, then the PDF as
# edition.pdf. Skills telling the model to stay quiet are not a gate —
# these keys are. Wait lines go through chat_status.py (a POST), not
# assistant text. Gateway restart is required after this block changes.
# plow-init recopies seed display over this file every boot — the image
# must stamp the same block into /opt/hermes/plow-seed/config.yaml
# (merge_pt_seed_config.py) or a recreate restores the loud defaults.
display:
  tool_progress: off
  interim_assistant_messages: false
  long_running_notifications: false
  busy_ack_detail: false
  live_status: off
  platforms:
    plow_chat:
      tool_progress: off
      interim_assistant_messages: false
      long_running_notifications: false
      busy_ack_detail: false
      live_status: off
plugins:
  enabled:
  - plow-chat-platform
platforms:
  plow_chat:
    enabled: true
    # No extra.group_prompts: one private chat, no groups. The plugin keys
    # group prompts by display name from PLOW_CHAT_GROUP_UIDS, and a prompt
    # naming no configured group is logged and skipped rather than fatal --
    # so adding one here before the group exists is a silent no-op.