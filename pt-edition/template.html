<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The Plow Times -- the fixed edition layout.

  This file is deliberately plain: inline CSS, no JavaScript, and no
  external assets loaded AT RENDER TIME -- the one exception, a news
  story's optional photo, is fetched and converted to a self-contained
  grayscale data: URI by render_edition.py (fetch_grayscale_photo)
  before this HTML is even built, so by the time the browser or
  WeasyPrint sees an <img> tag there is nothing left to fetch, same as
  everything else on the page. The renderer substitutes the
  placeholders (MASTHEAD, DATE, LOCATION, LEAD, WEATHER_EAR, DESKS_INLINE,
  SECTIONS, SUDOKU, and PAGE_CLASS/WEATHER/CALENDAR/MAIL/SPORTS/SIDEBAR
  for older templates that still read them individually) and escapes every value it
  inserts, so a page from the web
  can never inject markup here. Keep it that way: a script tag or an inline
  event attribute makes the Chrome-on-Mac PDF fallback execute untrusted
  content on the owner's machine. Fonts stay system/websafe for the same
  reason -- the renderer has no guarantee of network access when WeasyPrint
  runs, so a @font-face or Google Fonts <link> would fall back silently (or
  time out) on a real run. Every color below is a flat CSS value for the
  same reason: nothing here is fetched at render time.

  The masthead is drawn from PT_MASTHEAD (default "THE PLOW TIMES"),
  resolved by the renderer -- not from edition.json, so the chat edition and
  the printed page can never show two different names. Layout edits here
  survive redeploys: the deploy hook copies a skill into the agent's home
  only when absent.

  Newspaper layout modeled on an actual annotated broadsheet anatomy (ear,
  nameplate, folio, headline, dateline, body type), not a novelty template:

  - Ear: the small boxed area flanking the nameplate. A real front page
    runs two -- a slogan box on the left, a weather box on the right --
    each modest: a hairline border, small italic type, no fill, no bold
    caps. An earlier pass gave these the same visual weight as the
    nameplate itself (bold, larger type, thicker border) and they read as
    badges competing with the page instead of the quiet flourish an ear
    actually is; this pass shrinks them back down. The right ear is now
    WEATHER_EAR -- today's drawn icon and high/low only (weather_ear_html
    in render_edition.py), the same "weather box beside the nameplate"
    a real front page runs, standing in for the plain tagline when the
    weather desk has a forecast to draw from.
  - Nameplate: the MASTHEAD placeholder, centered, the one large display
    element on the page.
  - Folio: the line beneath the nameplate carrying volume/issue number,
    date and city -- small type, a hairline rule above and below, never
    bold or boxed. This is the OLD dateline bar, renamed and toned down
    to match what a folio actually looks like (no letter-spaced caps
    doing double duty as a second headline). The footer at the bottom of
    the page repeats "Vol. 1 -- No. 1" rather than its own wording (it
    used to say "Edição -- No. 1") -- that text is static in this file,
    not written by the model, so it can't follow the edition's own
    owner.language the way titles and body copy do; reusing the folio's
    already-established Vol./No. abbreviation sidesteps translating it
    instead of leaving it stuck in one language on every edition.
  - Headline: the lead story's headline is large, but -- matching a real
    front page, not a tabloid splash -- it is left-aligned, mixed case,
    and italic, not centered/uppercase/badge-kickered. Its size alone
    signals importance; no invented "Top Story" label sits above it
    (that was this project's own decoration, not a real broadsheet
    convention).
  - Dateline (per story) and byline are the two things a real front page
    has that this one still doesn't: naming a reporter would be
    fabrication (there is no author, just sourced synthesis) and a
    per-story city prefix would require the renderer to carry
    per-section location data it doesn't have. Both are left out rather
    than faked.

  Three desk layouts were tried for weather/calendar/mail before this
  one: a strip above all the news (pushed the well down, read as its
  own separate block instead of a sidebar); a rail beside ALL the news
  (three short desks next to twenty stories' worth of columns ran out
  of copy a few inches down while the columns kept going for a full
  page, leaving a long dangling gap); a rail beside just the LEAD story
  (fixed the gap, but still spent a whole column on three boxes that
  vary wildly in length day to day). This version drops the rail
  entirely: weather moves into the masthead's right ear (today's icon
  and high/low only -- see WEATHER_EAR above), and calendar/mail/sports
  read as full-width stories below the lead, the same anatomy as a news
  item (plain title with a rule under it, no box, no filled header) via
  DESKS_INLINE. Only the icon rows inside them (a meeting/call/reminder
  mark, an envelope mark, a scoreline) still say "this is a different
  kind of content" -- everything else about their layout is just "a
  story". This scales with content length in both directions: a short
  calendar entry is a short block, a long one is a long block, and
  neither measures itself against an unrelated column of news. SPORTS
  is conditional the same way MAIL already was -- it only runs when the
  owner actually follows teams (config-gated in pt-research), never
  guessed at or filled with a generic league digest.

  CALENDAR's `schedule` array draws one of five event-kind icons
  (meeting/call/task/reminder/note) beside a bold time and the title,
  because a day's events genuinely differ in kind; MAIL's `messages`
  array draws one constant envelope mark beside a bold sender and the
  subject, because a letter has no "kind" the way an event does -- the
  icon there is a row marker, not information; SPORTS' `games` array
  draws one row per followed team's game -- away @ home, and either
  the kickoff time (hasn't started) or the score (it has), no "live"
  state or clock, since a printed page is read after the fact and
  those would just be stale -- no crests either, since the renderer
  never fetches images and the team names carry the row instead. All
  three are optional: a section with none of these fields still prints as
  plain prose, same as before any of them existed, but if the
  structured field IS present the prose paragraphs are dropped from the
  print/HTML view entirely (see skip_body in html_section) so the box
  never shows the same event twice, once as a clean icon/score row and
  again as a redundant bullet restating it in a sentence -- `body` is
  still required in the JSON regardless, because the plain-text chat
  edition has no icons to fall back on and reads `body`, never
  `schedule`/`messages`/`games`.

  WEATHER's `forecast` array (validate() and forecast_grid()) no longer
  prints in the page body at all -- only WEATHER_EAR reads it now, and
  only today's entry (forecast[0]). A weather section with no `forecast`
  simply falls back to the plain ear tagline; the multi-day strip this
  field could draw is deliberately not shown anywhere else on the page,
  since a full grid competing with the lead story for space was the
  reason this desk moved to the ear in the first place. High/low only,
  no wind/humidity/precipitation (tried in an earlier pass and dropped)
  -- an ear has room for two numbers and an icon, nothing more.

  LEAD is the first news story, full width, alone in its own row --
  the size of its headline alone signals importance now that nothing
  sits beside it. SECTIONS is every other story, full width in two
  columns below DESKS_INLINE. LOCATION is this run's city from Latch,
  or "One copy" if unknown. PAGE_CLASS still exists for older
  templates using the SIDEBAR rail; this one no longer reads it.

  SUDOKU is a puzzle page below the news, not a standing desk --
  render_edition.py generates and solves it itself (scripts/sudoku.py),
  seeded on the edition's own date, so it needs nothing from
  edition.json and is never authored by the model. Always Easy or
  Medium (see sudoku.py's DIFFICULTIES) -- this is a breakfast paper for
  one reader, not a puzzle-page challenge. The full solution prints
  small underneath, since a solo reader has no next issue to carry it
  to.

  Palette: pure white paper (#ffffff) -- clean and light, never dark -- ink is a soft
  black-brown (never pure #000, which prints harsher than it previews), and
  a single dark-grey accent (#333333) marks department headers, the kicker
  rule and tags -- a strict monochrome scale (ink, two greys, white), no hue
  anywhere on the page.

  display:table, not grid, not float, and (as of this pass) not multicol
  either -- all three were measured live and broken in weasyprint's
  paginated engine: grid lost whole columns of content across page
  breaks, a float beside a multicol block let the second text column
  overlap the float instead of wrapping around it, and column-count on
  the news well itself (SECTIONS) rendered as a single column with the
  second column's width left blank in the actual PDF, even though it
  looked like two real columns in a browser preview -- browser-only
  testing had missed it. table-cell now only does the small jobs left
  for it -- the masthead's ear/nameplate/ear row and the folio line.
  SECTIONS is one column, stories stacked top to bottom like the lead;
  overflow just continues onto the next Letter-size sheet the way any
  block content does, no column-fill balancing needed. Each desk box in
  DESKS_INLINE still stays intact (break-inside:avoid) so one never
  splits across a page.
-->
<style>
  /* 15mm all around: the old 10mm/11mm sat close to the unprintable edge
     many home inkjet/laser printers actually have (often 4-5mm, sometimes
     more), and read as cramped even on screen. 15mm (~0.6in) is the
     standard narrow-but-safe margin for a newsletter-density page --
     tighter than a Word document's 1in default (this page needs the
     room), roomier than a press-printed broadsheet's ~10mm (this isn't
     web-offset printed, it's a home printer with real hardware margins
     to respect). */
  /* The running page number lives in the @page margin box (CSS Paged
     Media), not in the HTML body -- it's the only way a page count that
     WeasyPrint itself is still computing (a short edition is one sheet,
     a long one three) can be numbered without Python counting pages by
     hand. counter(page)/counter(pages) render as bare numerals, no
     "Page"/"of" words, since that text would be Python-authored and
     can't follow the edition's own owner.language the way body copy
     does -- the same reasoning as the Sudoku's dot rating. */
  @page {
    size: Letter; margin: 15mm; background: #ffffff;
    @bottom-center {
      content: "\2014  " counter(page) " / " counter(pages) "  \2014";
      font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
      font-size: 8px; color: #9a9a9a; letter-spacing: 0.5px;
    }
  }
  * { box-sizing: border-box; }

  :root {
    --paper: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #5c5c5c;
    --accent: #333333;
    --accent-soft: #767676;
    --hairline: #d0d0d0;
  }

  html { background: var(--paper); }
  body {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    color: var(--ink);
    margin: 0;
    line-height: 1.4;
    font-size: 12.5px;
    background: var(--paper);
    padding: 9px 5px 10px;
  }

  /* -- Masthead: two quiet ears, the nameplate, a plain folio line ------ */
  .rule-top { border: none; border-top: 1px solid var(--ink); margin: 0 0 5px; }
  .masthead-row { display: table; width: 100%; table-layout: fixed; }
  .ear {
    display: table-cell; vertical-align: bottom; width: 92px;
    padding-bottom: 6px;
  }
  .ear-left { text-align: left; }
  .ear-right { text-align: right; }
  .ear-box {
    display: inline-block; border: 1px solid var(--ink);
    padding: 4px 7px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 7.5px; font-style: italic; line-height: 1.35;
    color: var(--ink-soft); text-align: center;
  }
  .ear-weather {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-style: normal;
  }
  .ear-weather .wx-icon-wrap { color: var(--ink); line-height: 0; }
  .ear-weather .ear-wx-temps { display: flex; flex-direction: column; align-items: flex-start; }
  .ear-weather .ear-wx-high { font-weight: 800; font-size: 11px; color: var(--ink); line-height: 1.15; }
  .ear-weather .ear-wx-low { font-size: 9px; color: var(--ink-soft); line-height: 1.15; }
  .masthead-cell { display: table-cell; vertical-align: bottom; text-align: center; }
  .masthead {
    /* Big Caslon first: a real macOS system font (no bundling, no
       network fetch -- same "system/websafe only" rule as the rest of
       this file), and measured a much closer match to a traditional
       broadsheet nameplate than the Bodoni/Didot stack it replaces --
       those are high-contrast Didone faces that read as fashion-
       magazine, not newspaper. Big Caslon only ships one weight
       (WeasyPrint doesn't synthesize bold for it, confirmed: 400/700/900
       all render identically), so the size and letter-spacing carry the
       presence a bold weight would otherwise give the nameplate; the
       Didot/Bodoni/Playfair fallbacks stay for the rare system without
       Big Caslon, where their own font-weight:900 still applies. */
    font-family: "Big Caslon", Didot, "Bodoni MT", "Playfair Display", "Times New Roman", Georgia, serif;
    font-size: 47px; font-weight: 900; letter-spacing: 0.6px;
    margin: 0;
    line-height: 0.92;
    color: var(--ink);
  }
  .folio {
    display: table; width: 100%; table-layout: fixed;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 9px; letter-spacing: 0.4px;
    color: var(--ink-soft);
    border-top: 1px solid var(--ink);
    margin: 6px 0 0;
  }
  .folio span { display: table-cell; padding: 4px 2px; vertical-align: middle; }
  .folio .meta-left { text-align: left; }
  .folio .meta-center { text-align: center; }
  .folio .meta-right { text-align: right; }
  /* Double rule: a plain border-top+border-bottom on a thin box reads as
     two hairlines with a hint of daylight between them -- the classic
     newspaper divider (seen closing off the masthead and again above the
     footer on real front pages), sturdier than a single rule at marking
     "the chrome ends here, the page starts." No pseudo-elements needed,
     just two borders, so it survives WeasyPrint the same as any other
     border does -- but it needs its own box-sizing:content-box against
     the page's global border-box reset, or the 2px height already
     equals the two 1px borders with nothing left for the gap between
     them, and the "double" rule prints as one solid bar (measured: it
     did, in an early pass of this feature). content-box keeps the 2px
     as real daylight between the strokes. */
  .rule-double {
    box-sizing: content-box; height: 2px;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    margin: 3px 0 14px;
  }

  /* -- Page layout: the lead alone, then desks full width, then news --- */
  .top-row {
    margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 1.5px solid var(--ink);
  }

  /* Calendar and mail read as full-width stories now, the same anatomy
     as a news item -- plain title with a rule under it, no box, no
     filled header -- only the icon rows inside still mark them as a
     different kind of content. desk-slot is the same wrapper wrap_desk()
     already produces for the (retired) sidebar, reused here as the
     full-width row. */
  .desks-inline-wrap {
    margin-bottom: 16px; padding-bottom: 2px;
    border-bottom: 1.5px solid var(--ink);
  }
  .desks-inline-wrap .desk-slot { margin: 0 0 16px; }
  .desks-inline-wrap .desk-slot:last-child { margin-bottom: 0; }
  .desks-inline-wrap .section--desk {
    border: none; border-bottom: 1px solid var(--hairline);
    padding: 0 0 16px; margin: 0;
  }
  .desks-inline-wrap .desk-slot:last-child .section--desk {
    border-bottom: none; padding-bottom: 0;
  }
  .desks-inline-wrap .section--desk h2 {
    background: none; color: var(--ink); margin: 0 0 7px; padding: 0 0 6px;
    font-size: 15px; font-weight: 800; letter-spacing: 0.2px;
    text-transform: uppercase; border-bottom: 1.5px solid var(--ink);
  }
  .desks-inline-wrap .section--desk .headline {
    font-size: 12.5px; font-style: italic; font-weight: 700;
    color: var(--accent-soft); margin: 8px 0 8px;
    padding: 0; border-bottom: none;
  }
  .desks-inline-wrap .section--desk .sources,
  .desks-inline-wrap .section--desk .unsourced { padding: 0; margin-top: 6px; }
  .desks-inline-wrap .cal-list,
  .desks-inline-wrap .mail-list,
  .desks-inline-wrap .sp-list { padding: 0; margin: 10px 0 0; }

  /* News well: one column, stories stacked top to bottom with a hairline
     rule between them. CSS multicol (column-count: 2) read fine in a
     browser but rendered as a single column with the second column's
     width just left blank in an actual WeasyPrint PDF (see the top
     comment) -- a single column has no such gap to risk. */
  .main-col { }

  /* Lead story, alone in the top row, full width: the size alone signals
     importance, the way a real front page does it -- left-aligned,
     mixed case, italic, no centered splash treatment and no invented
     "Top Story" label. */
  .lead-cell .section {
    border: none; margin: 0; padding: 0;
    break-after: avoid-page;
  }
  .lead-cell h2 {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-style: italic; font-weight: 700;
    text-transform: none;
    font-size: 27px; letter-spacing: -0.3px; line-height: 1.12;
    border-bottom: none; padding-bottom: 0; margin: 0 0 8px;
  }
  .lead-cell .headline {
    font-size: 13px; font-style: normal; color: var(--ink);
  }
  .lead-cell p:not(.headline):not(.sources):not(.unsourced) {
    font-size: 12.5px; line-height: 1.6; text-align: justify;
  }
  /* Drop cap: a real <span class="dropcap"> emitted by html_section()
     (render_edition.py, drop_cap=True) -- not a ::first-letter
     pseudo-element. ::first-letter + float measured
     broken in WeasyPrint: the pseudo-element's box wasn't reserved in
     the line, so the letter right after the drop cap printed underneath
     it instead of beside it. A plain floated span has no such bug. */
  .lead-cell .dropcap {
    font-family: "Bodoni MT", Didot, "Playfair Display", Georgia, serif;
    font-size: 2.8em; font-weight: 900; font-style: normal; color: var(--ink);
    float: left; line-height: 0.78; padding: 0.02em 0.08em 0 0;
    /* A float sits at the very top of the line box, but the paragraph's
       own line-height (1.6) leaves half-leading space above its own
       first glyph that the cap's own tighter line-height (0.78) doesn't
       get -- so an unnudged cap reads visibly higher than the text
       beside it. Measured against the actual rendered text: 0.10em
       (of the cap's own, much larger, font-size) brings its top back in
       line with "onsumer"'s. */
    margin-top: 0.1em;
  }

  /* -- Story columns (news well) -- generous breathing room: the reader
     asked for the story format but felt it was too tight, so line-height,
     paragraph spacing and the gap between stories all opened up here. --- */
  .section {
    border: none;
    background: var(--paper);
    padding: 0 0 14px;
    margin: 0 0 14px;
    border-bottom: 1px solid var(--hairline);
    /* No break-inside here on purpose: a news story (especially the
       lead, now sometimes carrying a photo) can be taller than the
       space left on a page, and forcing it whole onto the next page
       left a nearly blank page behind it (measured, once a photo made
       the lead tall enough to trigger it). orphans/widows still keep a
       break from stranding a single dangling line. */
    orphans: 3; widows: 3;
  }
  .main-col > .section:last-child { border-bottom: none; }
  .section h2 {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 15px; font-weight: 800; line-height: 1.22;
    text-transform: uppercase; margin: 0 0 6px;
    letter-spacing: 0.2px;
    padding-bottom: 5px; border-bottom: 1.5px solid var(--ink);
    break-after: avoid;
  }
  .headline {
    font-size: 11.5px; font-weight: 700; font-style: italic;
    line-height: 1.4;
    margin: 8px 0 8px; color: var(--accent-soft);
  }
  /* A real photo, when a story has one -- render_edition.py fetches it
     and converts it to grayscale in Python before this HTML even
     exists (see fetch_grayscale_photo), because WeasyPrint doesn't
     implement CSS `filter`: a `filter: grayscale(1)` rule here was
     measured to leave the photo in full color, the one thing on the
     page that would break the monochrome rule. What lands in `src` is
     already a self-contained grayscale data: URI, so this block is
     just sizing and the credit line, not color correction. */
  .story-photo {
    margin: 4px 0 10px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .story-photo img {
    display: block; width: 100%; height: auto;
    border: 1px solid var(--hairline);
  }
  .story-photo figcaption {
    font-size: 8.5px; font-style: italic; color: var(--ink-soft);
    margin-top: 3px;
  }
  .section p {
    margin: 0 0 9px; font-size: 11.5px; line-height: 1.55;
    text-align: justify; hyphens: auto; -webkit-hyphens: auto;
  }
  .tag {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 8px; text-transform: uppercase; letter-spacing: 1px;
    background: var(--accent); color: var(--paper); padding: 1px 5px; vertical-align: middle;
    margin-left: 6px; white-space: nowrap;
  }
  .sources { font-size: 9px; color: var(--ink-soft); word-break: break-all; text-align: left; }
  .sources a { color: var(--ink-soft); }
  .unsourced { font-size: 10px; font-style: italic; color: var(--ink-soft); text-align: left; }

  /* -- Desk cards: bordered call-out boxes with a filled black header,
     the same boxed language as the masthead flags and a front page's
     "this week" index panel. */
  .section--desk {
    padding: 0;
    border: 1.5px solid var(--ink);
    break-inside: avoid; page-break-inside: avoid;
  }
  .section--desk h2 {
    background: var(--ink); color: var(--paper); margin: 0; padding: 7px 11px 6px;
    font-size: 10.5px; letter-spacing: 1.8px; font-weight: 800;
  }
  .section--desk h2 .desk-icon {
    display: inline-block; vertical-align: -2px; margin-right: 7px;
  }
  .section--desk .headline,
  .section--desk .sources,
  .section--desk .unsourced { padding: 0 11px; }
  .section--desk .headline {
    margin: 10px 0 10px; color: var(--ink-soft); line-height: 1.4;
    padding-bottom: 9px; border-bottom: 1px solid var(--hairline);
  }
  .section--priority {
    border: 2px solid var(--ink);
  }
  .section--priority .headline {
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
  }
  .priority-why {
    list-style: none; margin: 6px 0 0; padding: 0 11px;
    font-size: 11px; color: var(--ink-soft);
  }
  .priority-why li { margin: 0 0 6px; }
  .priority-why .src { font-style: italic; display: block; }
  .priority-step { font-weight: 700; padding: 0 11px; }
  .priority-window { padding: 0 11px; font-size: 11px; color: var(--ink-soft); }

  .section--desk p:last-of-type { margin-bottom: 0; }
  .section--desk .sources,
  .section--desk .unsourced { padding-bottom: 10px; margin-top: 4px; }

  /* Each paragraph in a desk reads as one bullet item -- a meeting, a
     message, a day's forecast -- not one dense run-on sentence. Generous
     line-height and a soft dash marker instead of a bordered row. */
  .section--desk p:not(.headline):not(.sources):not(.unsourced) {
    position: relative;
    margin: 0 0 11px; padding: 0 11px 0 20px;
    font-size: 11px; line-height: 1.55; text-align: left;
  }
  .section--desk p:not(.headline):not(.sources):not(.unsourced)::before {
    content: "\2022"; position: absolute; left: 11px; top: 0;
    color: var(--accent-soft); font-size: 13px; line-height: 1;
  }

  /* -- Weather strip: unused by the default body markup now that
     WEATHER_EAR carries the day's weather instead (see the top comment),
     but the multi-day forecast_grid() and this styling stay defined --
     the renderer still fills the WEATHER placeholder for any custom
     template that wants the full strip back, the same backward-compat
     contract SIDEBAR already has. A drawn (never fetched) icon per
     forecast day, in ink -- a real front page's weather map is a line
     drawing, not a colour illustration, and this stays inside the
     paper's monochrome rule. */
  .wx-grid {
    display: flex; flex-wrap: wrap;
    margin: 10px 0; padding: 0 11px;
    gap: 10px 4px;
  }
  .wx-day {
    display: flex; flex-direction: column; align-items: center;
    flex: 1 1 0; min-width: 46px;
    text-align: center;
    border-left: 1px solid var(--hairline);
    padding: 0 2px;
  }
  .wx-day:first-child { border-left: none; }
  .wx-day-name {
    font-weight: 800; font-size: 10px; letter-spacing: 0.4px;
    text-transform: uppercase; color: var(--ink);
  }
  .wx-day-date { font-size: 8px; color: var(--ink-soft); margin-bottom: 4px; }
  .wx-icon-wrap { color: var(--ink); margin: 2px 0 4px; }
  .wx-icon { display: block; }
  .wx-high { font-weight: 700; font-size: 11px; color: var(--ink); }
  .wx-low { font-size: 10px; color: var(--ink-soft); }

  /* -- Calendar strip: one drawn icon per event kind, a bold time, then
     the title -- the same "icon says what this is, at a glance" idea as
     the weather strip, applied to a day's schedule instead of a week's
     forecast. */
  .cal-list, .mail-list { margin: 10px 0 0; padding: 0 11px 10px; }
  .cal-item {
    display: flex; align-items: flex-start; gap: 8px;
    margin: 0 0 10px;
  }
  .cal-item:last-child { margin-bottom: 0; }
  .cal-icon-wrap { color: var(--ink-soft); flex: 0 0 auto; margin-top: 1px; }
  .cal-icon { display: block; }
  .cal-time {
    flex: 0 0 auto; min-width: 62px;
    font-weight: 800; font-size: 11px; color: var(--ink);
  }
  .cal-title { font-size: 11px; line-height: 1.4; color: var(--ink); }

  /* -- Mail strip: an envelope mark, the sender bold, the subject after --
     the same row shape as the calendar, minus a varying icon (a letter
     has no "kind" the way an event does). */
  .mail-item {
    display: flex; align-items: flex-start; gap: 8px;
    margin: 0 0 10px;
  }
  .mail-item:last-child { margin-bottom: 0; }
  .mail-icon-wrap { color: var(--ink-soft); flex: 0 0 auto; margin-top: 1px; }
  .mail-icon { display: block; }
  .mail-sender { font-weight: 800; font-size: 11px; color: var(--ink); margin-right: 5px; }
  .mail-subject { font-size: 11px; color: var(--ink-soft); }

  /* -- Sports strip: away @ home, and either the kickoff time (not
     started yet) or the score (it's over) -- no "live" state, no crests
     or logos. A printed page is read after the fact, so there is no
     "on air" to show; the renderer never fetches images either, so the
     teams' own names carry the row. */
  .sp-game {
    display: flex; align-items: baseline; flex-wrap: wrap;
    gap: 4px 10px; margin: 0 0 9px; padding-bottom: 9px;
    border-bottom: 1px solid var(--hairline);
  }
  .sp-game:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .sp-teams { font-size: 11px; color: var(--ink); flex: 1 1 auto; }
  .sp-away, .sp-home { font-weight: 800; }
  .sp-vs {
    color: var(--ink-soft); font-weight: 400; margin: 0 5px;
    font-size: 9px; text-transform: uppercase;
  }
  .sp-score {
    font-weight: 800; font-size: 12px; color: var(--ink);
    white-space: nowrap; flex: 0 0 auto;
  }

  /* -- Puzzle page: one Easy/Medium Sudoku, generated and verified by
     sudoku.py, never authored by the model -- a grid, not prose, so
     there is nothing here for an LLM to get wrong. Cell borders draw
     only right+bottom (the standard trick for a seamless grid of boxes
     instead of a <table>); the 3x3 blocks get an extra thick left/top
     line so the box structure reads at a glance. CSS grid is forbidden
     here: it was measured live and lost columns in WeasyPrint's paginated
     engine (same reason the page layout is display:table). The solution
     prints in full underneath, small and light -- a solo reader has no
     "next day's paper" to run it in, so it has to be somewhere in
     today's -- with no caption in front of it: a "Solução:"/"Solution:"
     label would be Python-authored text sitting outside the edition's
     own `owner.language`, so the 81 digits run on their own instead of
     risking a caption in the wrong language on a non-Portuguese
     edition. Set in a very light gray, well below the page's normal
     secondary-text color, so it doesn't catch the eye while the grid is
     still being worked: legible on purpose, just not something that
     jumps out the way every other line on the page does. */
  .puzzle-row { margin-top: 16px; }
  .sudoku-section {
    border: none; border-top: 1.5px solid var(--ink);
    padding: 12px 0 0; margin: 0;
    text-align: center;
    break-inside: avoid; page-break-inside: avoid;
  }
  .sudoku-section h2 {
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    font-size: 15px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.2px; margin: 0 0 10px; border-bottom: none;
  }
  /* Difficulty as filled/hollow dots (one per step) instead of a word --
     "Easy"/"Medium" would be Python-authored text that can't follow the
     edition's own language, the same reasoning as the solution line
     below having no caption. */
  .sk-difficulty { font-size: 9px; letter-spacing: 2px; padding: 2px 6px; }
  .sk-grid {
    border-collapse: collapse;
    margin: 0 auto 10px;
    border: 2px solid var(--ink);
  }
  .sk-cell {
    width: 24px; height: 24px; padding: 0;
    text-align: center; vertical-align: middle;
    border-right: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 12px; color: var(--ink-soft);
  }
  .sk-given { font-weight: 800; color: var(--ink); }
  .sk-box-left { border-left: 1.5px solid var(--ink); }
  .sk-box-top { border-top: 1.5px solid var(--ink); }
  .sk-solution {
    font-size: 6px; letter-spacing: 0.3px; color: var(--hairline);
    margin: 6px auto 0; white-space: nowrap; font-style: italic;
  }

  footer {
    display: table; width: 100%; table-layout: fixed;
    margin-top: 0;
    padding: 0;
    font-size: 8.5px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--ink-soft);
    break-inside: avoid;
  }
  .rule-double.rule-double--footer { margin: 14px 0 3px; }
  footer span { display: table-cell; vertical-align: middle; }
  footer .meta-left { text-align: left; }
  footer .meta-center { text-align: center; }
  footer .meta-right { text-align: right; }
</style>
</head>
<body>
  <hr class="rule-top">
  <div class="masthead-row">
    <div class="ear ear-left"><span class="ear-box">Every claim<br>carries its source</span></div>
    <div class="masthead-cell"><h1 class="masthead">{{MASTHEAD}}</h1></div>
    <div class="ear ear-right">{{WEATHER_EAR}}</div>
  </div>
  <div class="folio">
    <span class="meta-left">Vol. 1 &mdash; No. 1</span>
    <span class="meta-center">{{LOCATION}}, {{DATE}}</span>
    <span class="meta-right">Single Copy</span>
  </div>
  <div class="rule-double"></div>

{{PRIORITY}}
  <div class="top-row">
    <div class="lead-cell">{{LEAD}}</div>
  </div>
{{DESKS_INLINE}}
  <div class="main-col">
{{SECTIONS}}
  </div>

  <div class="puzzle-row">
{{SUDOKU}}
  </div>

  <div class="rule-double rule-double--footer"></div>
  <footer>
    <span class="meta-left">Vol. 1 &mdash; No. 1</span>
    <span class="meta-center">{{DATE}}</span>
    <span class="meta-right">{{MASTHEAD}}</span>
  </footer>
</body>
</html>
