# The Plow Times' instance override: its own image, plus TERMINAL_CWD.
#
# --- Why the image is built here -----------------------------------------
# The edition renderer emits the paper's PDF leg with weasyprint, which the
# fleet base does not carry (measured: `import weasyprint` is a
# ModuleNotFoundError in a running container). Dockerfile installs it. agent-mgr
# inspects the image named by AGENT_IMAGE in agent.env to pick the boot
# contract, so the `image:` below and that descriptor line must be the same
# tag -- a mismatch boots one image under another's derivation, silently.
#
# The build context is ${AGENT_DIR}, never `.`: agent-mgr runs
# `docker compose -f <this file> build` without changing directory, so a
# relative context resolves against agent-mgr's own directory, not this repo.
# `pull_policy: never` is required -- without it a registry image could be
# pulled over the local build and run with the agent's credentials. Build with
# `agent-mgr compose the-plow-times build`, then `agent-mgr restart`.
#
# --- No model pin, matching life-assistant-hermes-agent -------------------
# This agent no longer pins HERMES_PROVIDER/HERMES_MODEL to openrouter's
# google/gemini-2.5-flash-lite. Measured live: that model never once called
# skills_list/skill_view for a news request -- it went straight to a generic
# web_search tool and answered inline from that, so pt-intake (and every
# other pt-* skill) sat fully wired and discoverable but simply unused, no
# matter how the SOUL.md/SKILL.md instructions were worded. Leaving provider/
# model unset falls back to the Plow-hosted default (Anthropic, cloud-hosted
# by Plow) -- the same choice life-assistant-hermes-agent's own compose.yml
# makes by omission, and the one lever left that isn't a wording or a path
# fix. Re-pin only with the same live measurement this comment describes as
# evidence, not a hunch.
#
# --- TERMINAL_CWD, the same "config.yaml doesn't reach the process" bug ---
# runtime/config.yaml sets terminal.cwd, which gateway/run.py documents as
# "bridged to TERMINAL_CWD by the config bridge" at startup -- measured live
# on this deployment, it is not: `docker exec ... cat /proc/<gateway
# pid>/environ` shows no TERMINAL_CWD after a fresh restart, config.yaml
# content notwithstanding, and every turn logs "working-directory resolution
# fell back to the Hermes install tree (/opt/hermes)". That matters here
# specifically because every pt-* skill's scripts are invoked as absolute
# paths now (`/var/lib/hermes/skills/news/pt-*/scripts/...`), but the
# `run/<id>/edition.json` / `edition.pdf` paths those SKILL.md files write
# are still relative -- with cwd stuck at /opt/hermes (the read-only package
# source, not this agent's writable state) those writes have nowhere sane to
# land. Setting it directly here, like HERMES_PROVIDER/HERMES_MODEL, is the
# fix that is actually measured to reach the container's real environment on
# this fleet.
services:
  hermes:
    build: { context: "${AGENT_DIR}" }
    image: ${AGENT_IMAGE}
    pull_policy: never
    environment:
      - TERMINAL_CWD=/var/lib/hermes
